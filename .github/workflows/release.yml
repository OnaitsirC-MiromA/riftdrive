name: Release

# Publica uma versão: os executáveis de cada sistema no GitHub Releases e o
# pacote no npm. Dispara por tag (v2.0.0, v2.1.0…).
#
# O npm é publicado por trusted publishing (OIDC): nenhum token guardado em
# segredo, a credencial dura só esta execução. Pré-requisitos, uma vez só:
#   1. o pacote já existe no npm (a primeira versão sai da máquina do dono);
#   2. em npmjs.com → pacote → Settings → Trusted Publisher: GitHub Actions,
#      owner OnaitsirC-MiromA, repo riftdrive, workflow release.yml, environment
#      em branco. Os campos são comparados letra a letra, maiúsculas incluídas.
on:
  push:
    tags: ['v*']
  # Permite ensaiar o build da matriz sem publicar nada.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # Antes de gastar a matriz: o npm aceita o OIDC desta execução? É o mesmo
  # pedido que o `npm publish` faz por dentro, só que com a resposta à mostra —
  # o npm engole a recusa (só aparece em loglevel verbose) e termina num
  # ENEEDAUTH mudo. Falha aqui = Trusted Publisher ausente ou com algum campo
  # diferente das afirmações impressas abaixo.
  conferir-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trocar o OIDC do Actions pela credencial do npm
        run: |
          nome=$(jq -r .name package.json)
          id_token=$(curl -fsS -H "Accept: application/json" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)

          # O que o npm compara com o Trusted Publisher (só as afirmações, sem a
          # assinatura; nada aqui é segredo num repositório público).
          echo "Afirmações do token:"
          printf '%s' "$id_token" | cut -d. -f2 | python3 -c 'import sys, base64, json; p = sys.stdin.read().strip(); c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4))); print(json.dumps({k: c.get(k) for k in ("sub", "repository", "repository_owner", "job_workflow_ref", "environment", "ref")}, indent=2))'

          codigo=$(curl -sS -o resposta.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$nome")
          if [ "$codigo" != "200" ]; then
            echo "::error::npm recusou o OIDC (HTTP $codigo): $(cat resposta.json)"
            exit 1
          fi
          # A resposta é uma credencial de publicação de curta duração: não mostrar.
          rm -f resposta.json
          echo "npm aceitou o OIDC de $nome."

  # Testar uma vez só, antes de gastar a matriz inteira: se a suíte quebra, não
  # há por que construir cinco binários.
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

  binarios:
    needs: testar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       alvo: darwin-arm64, artefato: riftdrive-darwin-arm64 }
          - { os: macos-15-intel, alvo: darwin-x64,   artefato: riftdrive-darwin-x64 }
          - { os: ubuntu-latest,  alvo: linux-x64,    artefato: riftdrive-linux-x64 }
          - { os: ubuntu-24.04-arm, alvo: linux-arm64, artefato: riftdrive-linux-arm64 }
          - { os: windows-latest, alvo: win32-x64,    artefato: riftdrive-win32-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:binario

      # O executável sai sempre com o mesmo nome; renomear aqui é o que permite
      # o instalador escolher o arquivo certo pelo nome.
      - name: Renomear para o alvo
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv build/riftdrive.exe "build/${{ matrix.artefato }}"
          else
            mv build/riftdrive "build/${{ matrix.artefato }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefato }}
          path: build/${{ matrix.artefato }}
          retention-days: 1

  publicar:
    needs: [binarios, conferir-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `registry-url` de propósito: com ele o setup-node grava no .npmrc um
      # `_authToken=${NODE_AUTH_TOKEN}` e exporta um NODE_AUTH_TOKEN de mentira
      # (XXXXX-XXXXX…). O npm então publica com esse token falso em vez de trocar
      # o OIDC, e o registro responde E404 (actions/setup-node#1551).
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      # O npm que acompanha o Node 22 é o 10.x e não sabe falar OIDC; o trusted
      # publishing pede 11.5.1 ou mais novo. Atualizar antes de baixar os
      # binários: se isto falhar, é melhor saber agora.
      - name: Atualizar o npm para o trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - uses: actions/download-artifact@v4
        with: { path: artefatos, merge-multiple: true }

      # É esta lista que o instalador confere antes de instalar qualquer coisa.
      - name: Somas SHA-256
        run: |
          cd artefatos
          sha256sum riftdrive-* > checksums.txt
          cat checksums.txt

      - name: Publicar a release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotente: numa reexecução a release já existe, e `create` falharia.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artefatos/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artefatos/* --generate-notes --title "${GITHUB_REF_NAME}"
          fi

      - run: npm ci
      - run: npm run build
      # Sem NODE_AUTH_TOKEN de propósito: o npm detecta o OIDC do Actions e troca
      # por uma credencial de curta duração. A proveniência sai junto.
      - name: Publicar no npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
