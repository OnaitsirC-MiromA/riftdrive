name: Release

# Publica uma versão: os executáveis de cada sistema no GitHub Releases e o
# pacote no npm. Dispara por tag (v2.0.0, v2.1.0…).
#
# O npm é publicado por trusted publishing (OIDC): nenhum token guardado em
# segredo, a credencial dura só esta execução. Pré-requisitos, uma vez só:
#   1. o pacote já existe no npm (a primeira versão sai da máquina do dono);
#   2. em npmjs.com → pacote → Settings → Trusted Publisher: GitHub Actions,
#      owner OnaitsirC-MiromA, repo riftdrive, workflow release.yml.
on:
  push:
    tags: ['v*']
  # Permite ensaiar o build da matriz sem publicar nada.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # Testar uma vez só, antes de gastar a matriz inteira: se a suíte quebra, não
  # há por que construir cinco binários.
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

  binarios:
    needs: testar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       alvo: darwin-arm64, artefato: riftdrive-darwin-arm64 }
          - { os: macos-15-intel, alvo: darwin-x64,   artefato: riftdrive-darwin-x64 }
          - { os: ubuntu-latest,  alvo: linux-x64,    artefato: riftdrive-linux-x64 }
          - { os: ubuntu-24.04-arm, alvo: linux-arm64, artefato: riftdrive-linux-arm64 }
          - { os: windows-latest, alvo: win32-x64,    artefato: riftdrive-win32-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:binario

      # O executável sai sempre com o mesmo nome; renomear aqui é o que permite
      # o instalador escolher o arquivo certo pelo nome.
      - name: Renomear para o alvo
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv build/riftdrive.exe "build/${{ matrix.artefato }}"
          else
            mv build/riftdrive "build/${{ matrix.artefato }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefato }}
          path: build/${{ matrix.artefato }}
          retention-days: 1

  publicar:
    needs: binarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # O npm que acompanha o Node 22 é o 10.x e não sabe falar OIDC; o trusted
      # publishing pede 11.5.1 ou mais novo. Atualizar antes de baixar os
      # binários: se isto falhar, é melhor saber agora.
      - name: Atualizar o npm para o trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - uses: actions/download-artifact@v4
        with: { path: artefatos, merge-multiple: true }

      # É esta lista que o instalador confere antes de instalar qualquer coisa.
      - name: Somas SHA-256
        run: |
          cd artefatos
          sha256sum riftdrive-* > checksums.txt
          cat checksums.txt

      - name: Publicar a release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotente: numa reexecução a release já existe, e `create` falharia.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artefatos/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artefatos/* --generate-notes --title "${GITHUB_REF_NAME}"
          fi

      - run: npm ci
      - run: npm run build
      # Sem NODE_AUTH_TOKEN de propósito: o npm detecta o OIDC do Actions e troca
      # por uma credencial de curta duração. A proveniência sai junto.
      - name: Publicar no npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
